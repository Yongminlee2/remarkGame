org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# JDK 경로(org.gradle.java.home)는 여기 적지 않는다.
#
# 예전에는 이 파일에 박혀 있었는데, 그러면 이 파일을 그대로 받은 다른 컴퓨터에서는
# 그 경로가 없어 빌드가 깨진다. JDK 위치는 프로젝트가 아니라 '그 기계'의 사정이라
# 기계마다 하나씩 두는 파일에 적어야 한다:
#
#   <GRADLE_USER_HOME>/gradle.properties   (보통 ~/.gradle/gradle.properties)
#     org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
#
# JAVA_HOME 이 JDK 17 이상을 가리키고 있다면 그것만으로도 된다.
# 자세한 순서는 README 의 '새 컴퓨터에서 시작하기' 참고.
